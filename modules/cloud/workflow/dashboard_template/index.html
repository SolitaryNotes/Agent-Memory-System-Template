<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云端实验实时仪表盘</title>
<style>
  :root{
    --bg:#f6f8fa; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --accent:#0f766e; --running:#3b82f6; --running-bg:#eff6ff; --todo:#eef1f4;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:18px;font-weight:700}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--ink)}
  .bar{background:var(--line);border-radius:999px;height:10px;overflow:hidden}
  .bar>div{height:100%;width:0%;background:linear-gradient(90deg,#0d9488,#06b6d4);transition:width .5s}
  .meta{color:var(--muted);font-size:12px;margin:8px 0 18px}
  .grids{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-bottom:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel h2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
  .panel h2 b{color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cell{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;min-height:52px;display:flex;flex-direction:column;justify-content:center;background:var(--todo)}
  .cell .code{font-family:var(--mono);font-weight:600}
  .cell .val{font-family:var(--mono);color:var(--muted);margin-top:2px}
  .cell.local{background:#f0fdf4;border-color:#bbf7d0}
  .cell.local .tag{color:#15803d;font-size:10px}
  .cell.running{background:var(--running-bg);border-color:var(--running)}
  .cell.running .tag{color:var(--running)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .cell.running .tag{animation:pulse 1.2s infinite}
  .logs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .logs .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .logs select{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;color:var(--ink);max-width:60%}
  .logs pre{background:#0f172a;color:#e2e8f0;font-family:var(--mono);font-size:12px;padding:12px;border-radius:8px;height:340px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .footer{color:var(--muted);font-size:11px;margin-top:10px;text-align:right}
  .empty{color:var(--muted);font-size:12px;padding:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">云端实验实时仪表盘</h1>
    <span class="chip" id="chipCurrent">—</span>
    <span class="chip" id="chipEta">—</span>
  </header>
  <div class="bar"><div id="barFill"></div></div>
  <div class="meta" id="meta">加载中…</div>
  <div class="grids" id="grids"></div>
  <div class="logs">
    <div class="hd"><b>实时日志</b><select id="logSelect"></select></div>
    <pre id="logBox">（等待日志…）</pre>
  </div>
  <div class="footer">自动刷新 3s · <span id="updated">—</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
// 指标键名：与 progress.py 的 METRIC_KEY / cloud_coordination.md §6.4 保持一致。
// 老状态文件用 'mse' 也可读（仅作兼容），新写的都是 'value'。
const METRIC_KEY='value';
// 首段的取值列表**从矩阵里现推**（不再硬编码某个实验的取值），保持面板顺序稳定。
let ORDER=[];
let MATRIX=[], STATE={}, curLog='';

function metric(res){return res==null?null:(res[METRIC_KEY]!==undefined?res[METRIC_KEY]:res.mse);}
function fmt(v){return v!=null&&v!==''&&!isNaN(v)?(+v).toFixed(4):'—';}
function fmtHMS(s){s=Math.max(0,s);return Math.floor(s/3600)+'h'+Math.floor(s%3600/60)+'m';}
function metricColor(m){
  if(m==null)return 'var(--todo)';
  const vals=Object.values(STATE.results||{}).map(metric).filter(v=>v!=null);
  if(!vals.length)return '#ccfbf1';
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const t=hi>lo?Math.min(1,Math.max(0,(m-lo)/(hi-lo))):0.5;
  return 'hsl('+(165-165*t)+' 75% 92%)';
}
function render(){
  $('title').textContent=(STATE.experiment||'云端实验')+' · 实时仪表盘';
  const cur=STATE.current||{};
  $('chipCurrent').innerHTML='当前：<b>'+(cur.code?cur.code+' · rep'+(cur.rep||1)+(cur.stage?' · '+cur.stage:''):'空闲 / 初始化')+'</b>';
  const done=STATE.done_runs||0,total=STATE.total_runs||0,pct=total?Math.round(done/total*100):0;
  $('barFill').style.width=pct+'%';
  const eta=(STATE.elapsed_sec!=null&&done>0&&done<total)?Math.round(STATE.elapsed_sec*(total-done)/done):null;
  $('chipEta').innerHTML='ETA：<b>'+(eta?fmtHMS(eta):'—')+'</b>';
  $('meta').textContent='已跑 '+done+' / '+total+' runs（'+pct+'%） · 已用 '+fmtHMS(STATE.elapsed_sec||0)+(eta?' · 预计剩余 '+fmtHMS(eta):'');
  renderGrids();
}
function renderGrids(){
  const g=$('grids');g.innerHTML='';
  for(const s1 of ORDER){
    const cells=MATRIX.filter(r=>r.stage1===s1);
    if(!cells.length)continue;
    const panel=document.createElement('div');panel.className='panel';
    // ⚠️ 分组逻辑硬绑定「三段 × 三取值」的矩阵形态（首段 → 三个 3×3 面板，第二/三段 → 行列）。
    // 换实验形态必须改这里，以及 server.py 的列投影。本文件是**参考实现**，不是通用仪表盘。
    panel.innerHTML='<h2>首段=<b>'+s1+'</b> · 行=第二段 / 列=第三段</h2>';
    const grid=document.createElement('div');grid.className='grid';
    for(const r of cells){
      const res=(STATE.results||{})[r.code],cur=STATE.current||{};
      const div=document.createElement('div');div.className='cell';
      if(res)div.style.background=metricColor(metric(res));
      else if(cur.code===r.code)div.classList.add('running');
      else if(r.status==='done')div.classList.add('local');
      let body='<span class="code">'+r.code+'</span>';
      if(res)body+='<span class="val">'+fmt(metric(res))+'</span>';
      else if(cur.code===r.code)body+='<span class="tag">● running · rep'+(cur.rep||1)+'</span>';
      else if(r.status==='done')body+='<span class="tag">✓ '+(r.prev_name||'本地已有')+'</span>';
      else body+='<span class="val">—</span>';
      div.innerHTML=body;grid.appendChild(div);
    }
    panel.appendChild(grid);g.appendChild(panel);
  }
  if(!MATRIX.length)g.innerHTML='<div class="empty">矩阵未加载（/api/matrix 无数据）</div>';
}
async function poll(){
  try{
    const [s,m]=await Promise.all([fetch('/api/state').then(r=>r.json()),fetch('/api/matrix').then(r=>r.json())]);
    if(Array.isArray(m)&&m.length&&m[0].code){MATRIX=m;ORDER=[...new Set(m.map(r=>r.stage1).filter(v=>v!=null&&v!==''))];}
    if(s&&s.total_runs!=null)STATE=s;
    $('updated').textContent='更新于 '+new Date().toLocaleTimeString();
    render();
  }catch(e){$('updated').textContent='连接失败: '+e.message;}
}
async function reloadLog(){
  if(!curLog)return;
  try{
    const t=await fetch('/api/logs?name='+encodeURIComponent(curLog)+'&tail=300').then(r=>r.text());
    const box=$('logBox');box.textContent=t;box.scrollTop=box.scrollHeight;
  }catch(e){}
}
async function loadLogList(){
  try{
    const list=await fetch('/api/loglist').then(r=>r.json());
    const sel=$('logSelect');
    sel.innerHTML=(list.map(f=>'<option>'+f+'</option>').join(''))||'<option>（无日志）</option>';
    curLog=list[0]||'';sel.onchange=()=>{curLog=sel.value;reloadLog();};
    if(curLog)reloadLog();
  }catch(e){}
}
setInterval(poll,3000);setInterval(reloadLog,3000);
poll();loadLogList();
</script>
</body>
</html>
